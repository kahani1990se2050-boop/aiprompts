<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9303868594377536"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Score</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .score-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #1a365d;
            margin-bottom: 5px;
        }
        .live-indicator {
            color: #e53e3e;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        #match-name {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 15px;
            font-weight: 600;
        }
        #score {
            font-size: 32px;
            color: #2b6cb0;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #status {
            font-size: 14px;
            color: #718096;
            margin-bottom: 20px;
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="score-card">
        <h1>Cricket Live Score</h1>
        <div class="live-indicator">● LIVE</div>
        
        <div id="match-name">Loading match details...</div>
        <div id="score">--/--</div>
        <div id="status">Please wait...</div>
        
        <button onclick="fetchScore()">Refresh Score</button>
    </div>

    <script>
        // YAHAN APNA API KEY DAALEIN
        const API_KEY = "ec069a9f-e2f0-441e-9cec-56b920c6c724"; 
        
        // CricAPI endpoint for current matches
        const API_URL = `https://api.cricapi.com/v1/currentMatches?apikey=${API_KEY}&offset=0`;

        async function fetchScore() {
            document.getElementById('status').innerText = "Fetching live score...";
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (data.status !== "success") {
                    document.getElementById('status').innerText = "API Error. Check API Key.";
                    return;
                }

                // Pehla live match uthayenge
                const liveMatch = data.data.find(match => match.matchStarted === true);

                if (liveMatch) {
                    document.getElementById('match-name').innerText = liveMatch.name;
                    document.getElementById('status').innerText = liveMatch.status;

                    // Agar score available hai
                    if (liveMatch.score && liveMatch.score.length > 0) {
                        const currentInning = liveMatch.score[0]; // Latest inning
                        document.getElementById('score').innerText = 
                            `${currentInning.r}/${currentInning.w} (${currentInning.o} Overs)`;
                    } else {
                        document.getElementById('score').innerText = "Score not updated yet";
                    }
                } else {
                    document.getElementById('match-name').innerText = "No Live Matches Right Now";
                    document.getElementById('score').innerText = "-";
                    document.getElementById('status').innerText = "Try again later";
                }
                
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('status').innerText = "Failed to load data. Check internet.";
            }
        }

        // Page load hote hi score fetch karega
        fetchScore();
        
        // Har 30 seconds mein apne aap score update karne ke liye (30000 milliseconds)
        setInterval(fetchScore, 30000);
    </script>

</body>
</html>
